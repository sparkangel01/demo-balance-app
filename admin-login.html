<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body {
      background: linear-gradient(145deg, #0b1a2e, #1b2f45);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .login-box {
      background: rgba(18, 30, 46, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 2rem; padding: 2.5rem 2rem;
      max-width: 400px; width: 100%;
      border: 1px solid rgba(120, 180, 255, 0.15);
      box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.8);
    }
    h1 {
      color: #e2f0ff; font-size: 1.5rem; margin-bottom: 0.5rem;
      text-align: center; font-weight: 500;
    }
    p.sub { color: #7b9bc2; font-size: 0.85rem; text-align: center; margin-bottom: 2rem; }
    input {
      width: 100%; padding: 1rem 1.5rem;
      background: #0c1926; border: 1px solid #1d3349;
      border-radius: 2rem; color: #e0efff;
      font-size: 1rem; outline: none;
      margin-bottom: 1rem;
    }
    input:focus { border-color: #2f6396; }
    button {
      width: 100%; padding: 1rem;
      background: linear-gradient(135deg, #2d6b9e, #1a4568);
      border: none; border-radius: 2rem;
      color: white; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: 0.15s;
    }
    button:hover { transform: scale(1.01); filter: brightness(1.15); }
    .error {
      background: rgba(255, 100, 100, 0.1);
      border: 1px solid rgba(255, 100, 100, 0.3);
      color: #ff9e8a; padding: 0.8rem 1rem;
      border-radius: 1rem; font-size: 0.85rem;
      margin-bottom: 1rem; text-align: center;
    }
    .back-link {
      display: block; text-align: center; margin-top: 1.5rem;
      color: #6b8fb0; font-size: 0.8rem; text-decoration: none;
    }
    .back-link:hover { color: #b0d0f0; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>🔒 Admin Access</h1>
    <p class="sub">Enter your password to continue</p>
    <div id="errorMsg" style="display:none;" class="error">Wrong password. Try again.</div>
    <form method="POST" action="/admin/login">
      <input type="password" name="password" placeholder="Password" required autofocus>
      <button type="submit">Unlock Panel</button>
    </form>
    <a href="/" class="back-link">← Back to wallet</a>
  </div>
  <script>
    if (window.location.search.includes('error=1')) {
      document.getElementById('errorMsg').style.display = 'block';
    }
  </script>
</body>
</html>
